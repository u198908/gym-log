<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--pwa-->
<meta name="theme-color" content="#e9ebe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<!--/pwa-->
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: a training tool for sweaty thumbs: plain words, big numbers, nothing in the way
IDEA: a lifter's logbook crossed with a loaded barbell; the days you train are plates on the bar
PICTURE: the tool itself; this week drawn as a barbell, history as a field of plates
COLOUR and TYPE: rubber-floor graphite and chalk white, competition-plate red, yellow only for PRs; Barlow Condensed numerals, Barlow text
LAYOUT: one column up to 640px, bottom tab bar, sheets slide up from the bottom
*/
:root{--bg:#e9ebe8;--surface:#fff;--sunk:#f2f3f1;--ink:#131518;--muted:#5b6067;--line:#d3d7d2;--accent:#c4231a;--accent-bg:#d0271d;--gold:#f2c230;--warm:#8a6100;--focus:#1d5fd1;--shadow:0 1px 2px rgba(20,22,24,.05),0 10px 24px -18px rgba(20,22,24,.4);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1012;--surface:#181b1e;--sunk:#202428;--ink:#eff0ed;--muted:#9ba1a8;--line:#2e3338;--accent:#ff5b4f;--accent-bg:#d63a2f;--warm:#f2c230;--focus:#86b4ff;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1012;--surface:#181b1e;--sunk:#202428;--ink:#eff0ed;--muted:#9ba1a8;--line:#2e3338;--accent:#ff5b4f;--accent-bg:#d63a2f;--warm:#f2c230;--focus:#86b4ff;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
html.locked,html.locked body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.38;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:40px}h2{font-size:24px}h3{font-size:21px;font-weight:600}
p{margin:.4em 0}
.app{max-width:640px;margin:0 auto;padding:10px 12px 160px}
.muted{color:var(--muted)}.small{font-size:14px}.hint{font-size:14px;color:var(--muted);margin:6px 0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 2px 2px}
.kicker{margin:0 0 4px;font-weight:600;color:var(--accent);font-size:15px}
.sync{display:inline-flex;align-items:center;gap:6px;flex:none;margin-top:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.sync[data-s=wait] i{background:none;border:2px solid var(--muted)}
.sync[data-s=off] i{background:var(--accent)}
.sync[data-s=device] i{background:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.empty p,.welcome p{color:var(--muted)}
.sec{margin:22px 2px 4px;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.row.end{justify-content:flex-end}.row.tight{margin:8px 0 0;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;white-space:nowrap;cursor:pointer}
.btn.small{min-height:40px;padding:0 12px;font-size:15px}
.btn.primary{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--accent)}
.btn.dangerbg{background:none;border-color:var(--accent);color:var(--accent)}
.btn.wide{width:100%;margin:12px 0 4px}
.btn:active{transform:translateY(1px)}
.icon{width:44px;height:44px;flex:none;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);padding:0}
.icon svg{width:22px;height:22px}
input,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);font-size:16px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;padding:0;margin:0;flex:none;accent-color:var(--accent-bg)}
textarea{resize:vertical;line-height:1.4}
input.bad{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.field{display:block;margin:16px 0}
.field>span{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field.inline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.field.inline>span{margin:0;font-weight:500}
.field.inline input{max-width:110px;text-align:center}
.toggle{display:flex;align-items:center;gap:12px;min-height:44px;margin:4px 0;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1 1 auto;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:none;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* week barbell */
.week{margin:14px 0 6px}
.barbell{position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 0}
.barbell::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--muted);opacity:.55}
.collar{position:relative;width:8px;height:24px;border-radius:2px;background:var(--muted)}
.plate{position:relative;display:grid;place-items:center;width:min(46px,11.5vw);aspect-ratio:1;border-radius:50%;background:var(--surface);border:2px solid var(--line);font:700 17px "Barlow Condensed",sans-serif;color:var(--muted)}
.plate.on{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff;box-shadow:inset 0 0 0 5px rgba(255,255,255,.13),0 3px 0 rgba(0,0,0,.18)}
.plate.today{border-color:var(--ink);color:var(--ink)}
.plate.on.today{color:#fff;box-shadow:inset 0 0 0 5px rgba(255,255,255,.13),0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.week p{margin:6px 2px 0;color:var(--muted)}.week strong{color:var(--ink);font:700 22px "Barlow Condensed",sans-serif}
.nag{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;padding:10px 12px;border:1px solid var(--gold);border-radius:14px;background:var(--surface)}
.nag p{margin:0;font-size:15px}
/* workout cards */
.wk{display:flex;align-items:center;gap:10px;padding:0}
.wk-main{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;padding:14px 0 14px 16px;border:0;background:none;text-align:left}
.wk-name{font:700 27px/1.05 "Barlow Condensed",Barlow,sans-serif}
.wk-top{display:flex;align-items:center;gap:8px;font-size:14px}
.wk .start{margin-right:14px;min-width:82px}
.tag{background:var(--accent-bg);color:#fff;font:700 14px/1 "Barlow Condensed",sans-serif;padding:4px 7px;border-radius:6px}
.exlist{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.steps{padding-left:22px;margin:10px 0}.steps li{margin:6px 0}
/* session */
.sess-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;margin:0 -12px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.clock{font:700 28px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
#setcount{margin-right:auto;color:var(--muted)}
.item{padding:12px 10px 12px}
.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-left:4px}
.item-head h3{font-size:23px}
.menu{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.note{display:block;width:100%;margin:8px 0 2px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--sunk);text-align:left;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.note-edit{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:8px 0}
.last{margin:6px 0 0 4px;font-size:14px;color:var(--muted)}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 0;padding:8px 10px;border:1px solid var(--gold);border-radius:12px;background:var(--sunk);font-size:15px;line-height:1.35}
.cols,.set{display:grid;gap:5px;align-items:center}
.cols.two,.set.two{grid-template-columns:28px minmax(0,1.15fr) minmax(0,1fr) 46px}
.cols.one,.set.one{grid-template-columns:28px minmax(0,1fr) 46px}
.cols{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
.set{padding:3px 0}
.sn{height:46px;padding:0;border:0;border-radius:10px;background:none;display:grid;place-items:center;font:700 19px "Barlow Condensed",sans-serif;color:var(--muted)}
.sn.w{color:var(--warm)}
.sn.play{background:var(--sunk);color:var(--ink)}.sn.play svg{width:18px;height:18px}
.sn.play.on{background:var(--accent-bg);color:#fff}
.step{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);overflow:hidden}
.step button{padding:0;border:0;background:none;font:500 24px/1 Barlow,sans-serif;color:var(--ink)}
.step button:active{background:var(--line)}
.step input{width:100%;height:100%;min-height:0;padding:0;border:0;border-radius:0;background:none;text-align:center;font:700 22px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.set.warm .step input{color:var(--warm)}
.set.done .step{background:var(--surface)}
.running .step{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.check{position:relative;width:46px;height:46px;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:transparent;display:grid;place-items:center}
.check svg{width:24px;height:24px}
.check[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pr{display:inline-block;padding:3px 5px;border-radius:5px;background:var(--gold);color:#1d1600;font:700 13px/1 "Barlow Condensed",sans-serif}
.check .pr{position:absolute;top:-9px;right:-9px}
/* lists */
.toolbar{display:flex;gap:8px;margin:10px 0}.toolbar input{flex:1}
.list{list-style:none;margin:8px 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border:0;background:none;text-align:left}
.li-main{flex:1;display:flex;flex-direction:column;min-width:0}
.li-main strong{font-size:17px;font-weight:600}
.li-sets{max-width:46%;text-align:right;font:600 16px/1.2 "Barlow Condensed",sans-serif;color:var(--muted)}
.box{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--bg)}
.box svg{width:18px;height:18px}
.li[aria-pressed=true] .box{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.li:disabled .box{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.pad{padding:12px 2px}
/* history */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats>div{display:flex;flex-direction:column;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.app .stats>div{background:var(--surface);border:1px solid var(--line)}
.stats strong{font:700 26px/1.1 "Barlow Condensed",sans-serif;overflow-wrap:anywhere}
.stats span{font-size:13px;color:var(--muted)}
.heat{padding:14px;margin:12px 0;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.heat-grid{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;max-width:440px}
.heat-grid i{display:block;aspect-ratio:1;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.heat-grid i.on{background:var(--accent-bg);border-color:var(--accent-bg)}
.heat-grid i.fut{visibility:hidden}
.srow{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.sdate{flex:none;width:42px;display:flex;flex-direction:column;align-items:center}
.sdate strong{font:700 28px/1 "Barlow Condensed",sans-serif}.sdate span{font-size:13px;color:var(--muted)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,10,12,.5)}
.panel{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;padding:16px 16px 20px;border-radius:20px 20px 0 0;background:var(--surface);animation:up .2s ease-out}
.panel.still{animation:none}
@keyframes up{from{transform:translateY(28px);opacity:.3}}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:20px;max-height:88vh}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.sh-head h2{font-size:28px}
.sh-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.sh-foot.sticky{position:sticky;bottom:-20px;margin-bottom:-20px;padding-bottom:20px;background:var(--surface)}
.sh-foot .danger:first-child,.sh-foot .push{margin-right:auto}
.sub{margin:18px 0 6px;font-size:19px}
.dcols,.drow{display:grid;gap:6px;align-items:center}
.dcols.two,.drow.two{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px}
.dcols.one,.drow.one{grid-template-columns:34px minmax(0,1fr) 44px}
.dcols{font-size:13px;color:var(--muted);text-align:center}
.drow{margin:5px 0}.drow input{text-align:center;font:700 20px "Barlow Condensed",sans-serif}
.sn.static{cursor:default}
.field>.range{display:flex;align-items:center;gap:8px;margin:0}.range input{width:70px;text-align:center}
details.more{margin:14px 0;border-top:1px solid var(--line);padding-top:6px}
details.more summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.olist{list-style:none;margin:0 0 6px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.olist li{display:flex;align-items:center;gap:8px;padding:6px 2px 6px 12px}
.olist li+li{border-top:1px solid var(--line)}
.oi-n{width:20px;flex:none;font:700 18px "Barlow Condensed",sans-serif;color:var(--muted)}
.oi-main{flex:1;display:flex;flex-direction:column;min-width:0}.oi-main strong{font-weight:600}
.oi-act{display:flex;flex:none}
.fig{position:relative;height:200px;margin:6px 0 4px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{font:13px Barlow,sans-serif;fill:var(--muted)}
.fig.bars{height:180px}
.ph-bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:12px 0 4px;padding-bottom:1px;border-bottom:1px solid var(--line)}.ph-bars i{flex:1;border-radius:3px 3px 0 0;background:var(--line);opacity:.7}
.hseg{margin:10px 0 4px}
select{width:100%;min-height:46px;margin:6px 0 10px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink);font:600 16px Barlow,sans-serif}
.card .seg{margin:6px 0}
.trend{margin:12px 0 4px;font-size:15px}.trend strong{font:700 22px "Barlow Condensed",sans-serif}
.mrows{display:grid;gap:8px;margin-top:10px}
.mrow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:15px}
.mrow strong{text-align:right;font:700 18px "Barlow Condensed",sans-serif}
.mbar{height:14px;border-radius:7px;background:var(--sunk)}.mbar i{display:block;height:100%;border-radius:7px;background:var(--accent-bg)}
.hist-mini{list-style:none;margin:0;padding:0}
.hist-mini li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hist-mini li span:first-child{color:var(--muted)}
.sitem{padding:10px 0;border-top:1px solid var(--line)}
.slist{margin:6px 0 0;padding-left:24px;font:600 18px/1.4 "Barlow Condensed",sans-serif}
.slist .w{color:var(--warm)}
.prs p{display:flex;align-items:center;gap:8px;margin:6px 0}
.choice{margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.choice legend{padding:0 4px;font-weight:600}
.bul{margin:8px 0;padding-left:22px}
.gate{max-width:420px;margin:12vh auto 0;text-align:center}.gate p{color:var(--muted)}.gate .btn.wide{margin:8px 0}
.gate-mark{width:88px;height:88px;margin-bottom:12px}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 6.5em;gap:10px}.dt .field{margin:8px 0 12px}
.mono{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
/* fixed bars */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line)}
.tabs>div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:640px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;padding:8px 0 10px;border:0;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--accent)}
.rest{position:fixed;left:50%;bottom:72px;z-index:30;width:min(616px,calc(100% - 24px));transform:translateX(-50%);overflow:hidden;border:1px solid #33383d;border-radius:16px;background:#16191c;color:#f4f4f1;box-shadow:0 12px 30px -12px rgba(0,0,0,.55)}
.rest-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-bg);transition:width .25s linear}
.rest-in{position:relative;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px}
.rest-lab{font-weight:600}
.rest-t{margin-right:auto;font:700 30px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.rest .btn{background:rgba(255,255,255,.14);border-color:transparent;color:inherit;padding:0 10px}
.toast{position:fixed;left:50%;bottom:74px;z-index:60;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 24px);padding:10px 10px 10px 16px;transform:translateX(-50%);border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast .btn{background:none;border-color:currentColor;color:inherit}
body.has-rest .toast{bottom:142px}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.rest-fill{transition:none}}
@media (max-width:370px){h1{font-size:34px}.wk-name{font-size:24px}.btn{padding:0 14px}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<div id="rest" class="rest" hidden role="timer">
  <div class="rest-fill"></div>
  <div class="rest-in"><span class="rest-lab">Rest</span><strong class="rest-t">0:00</strong>
    <button class="btn small" data-act="rest-adj" data-d="-15" aria-label="15 seconds less">−15</button>
    <button class="btn small" data-act="rest-adj" data-d="15" aria-label="15 seconds more">+15</button>
    <button class="btn small" data-act="rest-skip">Skip</button></div>
</div>

  return { at: o.exportedAt, data: { exercises: d.exercises.map(normEx), workouts: d.workouts.map(normWk), settings: normSettings(d.settings), sessions: (Array.isArray(d.sessions) ? d.sessions : []).map(normSession), active: d.active ? normSession(d.active) : null } };

  stopTimers(); ui.menu = -1; ui.noteEdit = -1;
  const t = now(), keep = new Map(d.sessions.map(s => [s.id, { ...s, edited: t + 1 }]));
  S.lib = { exercises: d.exercises, workouts: d.workouts, settings: { ...d.settings, lastBackup: Math.max(d.settings.lastBackup || 0, S.lib.settings.lastBackup || 0) }, updatedAt: t };
  S.active = { session: d.active || null, updatedAt: t };
  const months = new Set(Object.keys(S.hist)); for (const s of keep.values()) months.add(monthOf(s.start));
  const H = {};
  for (const m of months) { const old = S.hist[m] || normMonth(), del = { ...old.deleted }; for (const s of old.sessions) if (!keep.has(s.id)) del[s.id] = t; H[m] = { sessions: [], deleted: del, updatedAt: t }; }
  for (const s of keep.values()) { const m = H[monthOf(s.start)]; delete m.deleted[s.id]; m.sessions.push(s); }
  for (const m in H) H[m].sessions.sort((a, b) => a.start - b.start);

}

/* one-time removal of the old sample exercises, only those never used */
const SAMPLE = ['Bench press|Chest|reps', 'Overhead press|Shoulders|reps', 'Incline dumbbell press|Chest|reps', 'Lateral raise|Shoulders|reps', 'Triceps pushdown|Triceps|reps', 'Pull-up|Back|bw', 'Barbell row|Back|reps', 'Lat pulldown|Back|reps', 'Face pull|Shoulders|reps', 'Dumbbell curl|Biceps|reps', 'Dead hang|Forearms|time', 'Back squat|Quads|reps', 'Romanian deadlift|Hamstrings|reps', 'Leg press|Quads|reps', 'Lying leg curl|Hamstrings|reps', 'Standing calf raise|Calves|reps', 'Plank|Core|time'];
function cleanupSamples() {
  if (S.lib.settings.cleanup1 || ui.loading || (Cloud.mode === 'cloud' && !Cloud.ready)) return;
  const used = new Set(); S.lib.workouts.forEach(w => w.exIds.forEach(id => used.add(id)));
  allSessions().forEach(s => s.items.forEach(it => used.add(it.exId)));
  if (S.active.session) S.active.session.items.forEach(it => used.add(it.exId));
  const before = S.lib.exercises.length;
  S.lib.exercises = S.lib.exercises.filter(e => used.has(e.id) || !SAMPLE.includes(e.name + '|' + e.muscle + '|' + e.kind));
  const n = before - S.lib.exercises.length;
  S.lib.settings.cleanup1 = true; touch('lib'); render();
  if (n) toast(`Removed ${n} sample exercise${n === 1 ? '' : 's'}`);
}
